<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Senka API Console</title>
        <style>
            :root {
                --ink: #16222d;
                --muted: #65727c;
                --paper: #f5f1e8;
                --panel: #fffdf8;
                --line: #d8d0c1;
                --accent: #d85d3c;
                --accent-dark: #a83d29;
                --teal: #197a78;
                --shadow: 0 18px 45px rgba(47, 39, 28, 0.12);
            }

            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                color: var(--ink);
                background: radial-gradient(circle at 85% 8%, #f4c9a0 0, transparent 28%), linear-gradient(135deg, #f5f1e8 0%, #e7eee8 100%);
                font-family: Georgia, "Times New Roman", serif;
                min-height: 100vh;
            }
            .shell {
                width: min(1100px, calc(100% - 40px));
                margin: 0 auto;
                padding: 34px 0 56px;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 24px;
                margin-bottom: 42px;
            }
            .eyebrow {
                color: var(--accent-dark);
                font:
                    700 12px/1.2 system-ui,
                    sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }
            h1 {
                font-size: clamp(40px, 7vw, 78px);
                line-height: 0.92;
                margin: 10px 0 0;
                font-weight: 500;
                letter-spacing: 0;
            }
            .base-url {
                width: min(410px, 100%);
                color: var(--muted);
                font:
                    13px/1.5 system-ui,
                    sans-serif;
            }
            .base-url input {
                width: 100%;
                margin-top: 7px;
                padding: 11px 12px;
                border: 1px solid var(--line);
                background: rgba(255, 255, 255, 0.65);
                color: var(--ink);
                font: inherit;
            }
            .grid {
                display: grid;
                grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
                gap: 22px;
            }
            .panel {
                background: rgba(255, 253, 248, 0.84);
                border: 1px solid rgba(216, 208, 193, 0.9);
                box-shadow: var(--shadow);
                padding: 26px;
            }
            .panel h2 {
                margin: 0 0 20px;
                font-size: 24px;
                font-weight: 500;
            }
            .actions {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            button {
                border: 1px solid var(--ink);
                background: var(--ink);
                color: #fffdf8;
                padding: 13px 14px;
                cursor: pointer;
                font:
                    700 13px system-ui,
                    sans-serif;
                text-align: left;
            }
            button:hover {
                background: var(--accent-dark);
                border-color: var(--accent-dark);
            }
            button span {
                display: block;
                color: #f4c9a0;
                font-size: 11px;
                margin-bottom: 5px;
            }
            .hello {
                display: flex;
                gap: 8px;
                margin-top: 10px;
            }
            .hello input {
                min-width: 0;
                flex: 1;
                border: 1px solid var(--line);
                padding: 12px;
                font:
                    15px system-ui,
                    sans-serif;
                background: #fff;
            }
            .hello button {
                flex: 0 0 auto;
            }
            pre {
                min-height: 250px;
                max-height: 440px;
                overflow: auto;
                margin: 0;
                padding: 18px;
                background: #16222d;
                color: #dce8df;
                font:
                    13px/1.6 Consolas,
                    monospace;
                white-space: pre-wrap;
            }
            .status {
                color: var(--muted);
                font:
                    12px system-ui,
                    sans-serif;
                margin-top: 12px;
            }
            .status.ok {
                color: var(--teal);
            }
            .status.error {
                color: var(--accent-dark);
            }
            footer {
                margin-top: 28px;
                color: var(--muted);
                font:
                    12px system-ui,
                    sans-serif;
            }
            @media (max-width: 760px) {
                .shell {
                    width: min(100% - 24px, 600px);
                    padding-top: 24px;
                }
                header {
                    display: block;
                    margin-bottom: 28px;
                }
                .base-url {
                    margin-top: 24px;
                }
                .grid {
                    grid-template-columns: 1fr;
                }
                .panel {
                    padding: 20px;
                }
            }
        </style>
    </head>
    <body>
        <main class="shell">
            <header>
                <div>
                    <div class="eyebrow">Edge API / Cloudflare Workers</div>
                    <h1>Senka<br />Console</h1>
                </div>
                <label class="base-url"
                    >Worker base URL
                    <input id="base-url" value="https://senka-api.takahashi-masa.workers.dev" spellcheck="false" />
                </label>
            </header>

            <section class="grid">
                <article class="panel">
                    <h2>API を試す</h2>
                    <div class="actions">
                        <button data-path="/api"><span>GET /api</span>接続確認</button>
                        <button data-path="/api/course"><span>GET /api/course</span>講座一覧</button>
                        <button data-path="/api/fortune"><span>GET /api/fortune</span>今日の運勢</button>
                        <button data-path="/api/events"><span>GET /api/events</span>イベント一覧</button>
                    </div>
                    <div class="hello">
                        <input id="name" value="山田" aria-label="名前" placeholder="名前を入力" />
                        <button id="hello-button"><span>GET /api/hello</span>あいさつ</button>
                    </div>
                </article>

                <article class="panel">
                    <h2>Response</h2>
                    <pre id="response">ボタンを押すとAPIの応答を表示します。</pre>
                    <div id="status" class="status">未接続</div>
                </article>
            </section>
            <footer>本番公開用の静的 Pages 画面。Worker URL は環境に合わせて変更できます。</footer>
        </main>

        <script>
            const baseUrl = document.querySelector("#base-url");
            const responseBox = document.querySelector("#response");
            const status = document.querySelector("#status");

            async function request(path) {
              const url = `${baseUrl.value.replace(/\\/$/, "")}${path}`;
              responseBox.textContent = "Loading...";
              status.className = "status";
              try {
                const response = await fetch(url);
                const body = await response.json();
                responseBox.textContent = JSON.stringify(body, null, 2);
                status.textContent = `${response.status} ${response.statusText}`;
                status.classList.add(response.ok ? "ok" : "error");
              } catch (error) {
                responseBox.textContent = JSON.stringify({ error: error.message }, null, 2);
                status.textContent = "接続に失敗しました。Worker URLとCORS設定を確認してください。";
                status.classList.add("error");
              }
            }

            document.querySelectorAll("[data-path]").forEach((button) => {
              button.addEventListener("click", () => request(button.dataset.path));
            });

            document.querySelector("#hello-button").addEventListener("click", () => {
              const name = document.querySelector("#name").value.trim();
              request(`/api/hello?name=${encodeURIComponent(name)}`);
            });
        </script>
    </body>
</html>
